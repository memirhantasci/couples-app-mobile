name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tip denetimi
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Birim testleri
        run: npm test -- --ci
